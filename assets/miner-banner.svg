<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc">
  <title id="title">Miner - Home Assistant ASIC miner integration</title>
  <desc id="desc">Version-independent Miner banner for local ASIC miner monitoring and control in Home Assistant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="0.55" stop-color="#111a24"/>
      <stop offset="1" stop-color="#080d12"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#697887"/>
      <stop offset="0.5" stop-color="#29333d"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb31a"/>
      <stop offset="1" stop-color="#ff7a00"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="400" rx="28" fill="url(#bg)"/>
  <path d="M0 340 L250 0" stroke="#ff8a00" stroke-width="3" opacity="0.45"/>
  <path d="M1300 400 L1600 60" stroke="#ff8a00" stroke-width="3" opacity="0.5"/>
  <path d="M0 380 L290 0" stroke="#25303b" stroke-width="20" opacity="0.35"/>
  <path d="M1250 400 L1600 0" stroke="#25303b" stroke-width="22" opacity="0.35"/>

  <!-- stylized miner icon -->
  <g transform="translate(80 48)" filter="url(#shadow)">
    <path d="M70 92 C74 38 116 8 166 8 C214 8 255 37 263 88 L263 101 L70 101 Z" fill="url(#orange)" stroke="#2c210c" stroke-width="8"/>
    <rect x="157" y="18" width="20" height="78" rx="10" fill="#e38b00" opacity="0.55"/>
    <circle cx="257" cy="72" r="34" fill="#111820" stroke="#697887" stroke-width="10"/>
    <circle cx="257" cy="72" r="18" fill="#f7fbff"/>
    <rect x="44" y="96" width="260" height="220" rx="28" fill="url(#steel)" stroke="#111820" stroke-width="9"/>
    <circle cx="121" cy="205" r="62" fill="#0a0f14" stroke="#8b99a6" stroke-width="8"/>
    <circle cx="121" cy="205" r="12" fill="#8694a0"/>
    <g stroke="#64727f" stroke-width="8" stroke-linecap="round">
      <line x1="121" y1="150" x2="121" y2="260"/>
      <line x1="66" y1="205" x2="176" y2="205"/>
      <line x1="82" y1="166" x2="160" y2="244"/>
      <line x1="160" y1="166" x2="82" y2="244"/>
    </g>
    <circle cx="236" cy="205" r="59" fill="#10171e" stroke="#7c8995" stroke-width="8"/>
    <path d="M244 151 L208 211 H236 L222 259 L270 194 H241 Z" fill="url(#orange)" stroke="#3b2706" stroke-width="5" filter="url(#glow)"/>
    <circle cx="68" cy="122" r="7" fill="#a8b3bc"/>
    <circle cx="280" cy="122" r="7" fill="#a8b3bc"/>
    <circle cx="68" cy="290" r="7" fill="#a8b3bc"/>
    <circle cx="280" cy="290" r="7" fill="#a8b3bc"/>
  </g>

  <g transform="translate(450 86)">
    <text x="0" y="105" fill="#f4f7fa" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="800" letter-spacing="-4">Miner</text>
    <text x="4" y="164" fill="#b8c2cc" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="500">Local ASIC miner monitoring &amp; control</text>
    <text x="4" y="210" fill="#b8c2cc" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="500">for Home Assistant</text>
    <rect x="4" y="246" width="455" height="5" rx="2.5" fill="url(#orange)" opacity="0.9"/>
    <text x="4" y="292" fill="#82909c" font-family="Arial,Helvetica,sans-serif" font-size="23">Local-first · No cloud required · Automation ready</text>
  </g>

  <g transform="translate(1160 85)" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#f1f4f7">
    <g transform="translate(0 0)"><path d="M10 16 L32 16 L20 43 L41 43 L6 90 L16 54 L0 54 Z" fill="#ff9900"/><text x="65" y="48">Monitor</text></g>
    <g transform="translate(0 74)"><rect x="4" y="38" width="7" height="28" rx="2" fill="#ff9900"/><rect x="18" y="25" width="7" height="41" rx="2" fill="#ff9900"/><rect x="32" y="12" width="7" height="54" rx="2" fill="#ff9900"/><path d="M0 70 H45" stroke="#ff9900" stroke-width="6"/><text x="65" y="48">Control</text></g>
    <g transform="translate(0 148)"><circle cx="22" cy="38" r="18" fill="#ff9900"/><circle cx="22" cy="38" r="7" fill="#101820"/><g stroke="#ff9900" stroke-width="7"><line x1="22" y1="7" x2="22" y2="0"/><line x1="22" y1="76" x2="22" y2="69"/><line x1="-9" y1="38" x2="-16" y2="38"/><line x1="60" y1="38" x2="53" y2="38"/></g><text x="65" y="48">Automate</text></g>
    <g transform="translate(0 222)"><path d="M22 4 L48 14 V35 C48 57 37 71 22 80 C7 71 -4 57 -4 35 V14 Z" fill="none" stroke="#ff9900" stroke-width="7"/><path d="M8 38 L18 48 L37 27" fill="none" stroke="#ff9900" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="48">Protect</text></g>
  </g>
</svg>
