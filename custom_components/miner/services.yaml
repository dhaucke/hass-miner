reboot:
  name: Reboot miner
  description: Reboots one or more miners when supported by their backend.
  fields:
    device_id:
      name: Device
      description: Miner device or devices to reboot.
      required: true
      selector:
        device:
          integration: miner
          multiple: true

restart_backend:
  name: Restart mining backend
  description: Restarts the mining process on one or more miners when supported.
  fields:
    device_id:
      name: Device
      description: Miner device or devices whose mining backend should restart.
      required: true
      selector:
        device:
          integration: miner
          multiple: true

set_work_mode:
  name: Set work mode
  description: Sets a firmware-defined work mode on one or more supported miners.
  fields:
    device_id:
      name: Device
      description: Miner device or devices to change.
      required: true
      selector:
        device:
          integration: miner
          multiple: true
    mode:
      name: Mode
      description: Firmware-defined work mode.
      required: true
      default: "normal"
      selector:
        select:
          options:
            - "low"
            - "normal"
            - "high"
