[tool.poetry]
name = "hass-miner"
version = "2.0.0.dev1"
description = "Local Home Assistant integration for monitoring and controlling ASIC miners"
authors = ["hass-miner contributors"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14.2,<3.15"
homeassistant = ">=2026.3.0,<2027.0"
pyasic = "0.78.8"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.12.5"
pytest = ">=8.4.0"
pytest-asyncio = ">=1.1.0"
pre-commit = ">=4.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
